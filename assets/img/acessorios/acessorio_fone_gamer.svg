    <ellipse cx="210" cy="142" rx="11" ry="18" fill="#be123c" stroke="#881337" stroke-width="2"/>
    <!-- Microfone fofo com coração -->
    <path d="M 70 154 Q 90 172 114 172" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>
