    <!-- Orelhas com LED no Arco -->
    <polygon points="94,76 96,42 120,62" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
    <polygon points="98,70 100,48 115,60" fill="#38bdf8"/>
    <polygon points="186,76 184,42 160,62" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
    <polygon points="182,70 180,48 165,60" fill="#38bdf8"/>
    <!-- Almofadas auriculares sobre as orelhas (x=70 e x=210, cy=142) -->
