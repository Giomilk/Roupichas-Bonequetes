<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
            <defs>
                <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
                <linearGradient id="runway" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
                <linearGradient id="lightL" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
                <linearGradient id="lightR" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
            </defs>
            <rect width="800" height="1200" fill="url(#night)"/>
            <!-- Feixes de Luz dos Holofotes -->
            <polygon points="50,0 200,1200 450,1200 150,0" fill="url(#lightL)"/>
            <polygon points="750,0 600,1200 350,1200 650,0" fill="url(#lightR)"/>
            <!-- Passarela Rosa Neon em Perspectiva -->
            <polygon points="280,600 520,600 640,1200 160,1200" fill="url(#runway)"/>
            <!-- Borda Neon da Passarela -->
            <line x1="280" y1="600" x2="160" y2="1200" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round"/>
            <line x1="520" y1="600" x2="640" y2="1200" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round"/>
            <!-- Estrelinhas e Brilhos -->
            <circle cx="200" cy="200" r="3" fill="#ffffff"/><circle cx="250" cy="350" r="4" fill="#fdf2f8"/>
            <circle cx="600" cy="180" r="4" fill="#ffffff"/><circle cx="550" cy="290" r="3" fill="#fdf2f8"/>
        </svg>